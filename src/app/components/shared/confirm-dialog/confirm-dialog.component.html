<div class="popup-overlay">
    <!-- Popup Modal -->
    <div class="popup">
        <h3 class="popup-title">Quiers guardar este diseño ?</h3>
        <input type="text" class="popup-input" placeholder="Escribe un nombre..."
               [(ngModel)]="designName">
        <div class="popup-actions">
            <button class="popup-btn cancel" (click)="cancel()">No</button>
            <button class="popup-btn accept" (click)="confirm()">Si</button>
        </div>
    </div>
</div>
