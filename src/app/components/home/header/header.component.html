<header class="h-100">

        <div class="d-flex justify-content-start px-5 align-items-center col-6">
            <h1 class="brandLabel">BUSINESS</h1>
        </div>
        <div class="d-flex flex-nowrap justify-content-end col-6">
            <a class="mx-2 d-flex justify-content-between align-items-center logIn__Button" routerLink="/" fragment="services"><strong>Servicios</strong></a>
            <a class="mx-2 d-flex justify-content-between align-items-center logIn__Button" routerLink="/" fragment="faqs"><strong>Preguntas Frecuentes</strong></a>
            <a class="mx-2 d-flex justify-content-between align-items-center logIn__Button"><strong>Ingresar</strong></a>
            <a class="d-flex justify-content-between align-items-center whatsAppButton" [href]="whatsAppUrl" target="_blank"><i class="bi bi-whatsapp whatsappIcon mr-4 col-3"></i><span class="col-9">Comunicate con nosotros</span></a>            
        </div>
    </div>
