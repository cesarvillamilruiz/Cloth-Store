<header class="h-100">
    <div class="h-100 w-100 d-flex justify-content-between">
        <div class="d-flex justify-content-start px-5 align-items-center col-4">
            <h1 class="brandLabel">BUSINESS</h1>
        </div>
        <div class="d-flex justify-content-end align-items-center col-8">
            <div [ngClass]="isMenuOpen ? 'd-flex' : 'd-none'" class="d-md-flex flex-nowrap flex-column flex-md-row justify-content-md-end col-8 col-md-6 pt-5 pt-md-0">
                <a class="mx-md-3 d-flex text-md-end align-items-center logIn__Button h5" routerLink="/" fragment="services">Servicios</a>
                <a class="mx-md-3 d-flex text-md-center align-items-center logIn__Button h5" routerLink="/" fragment="faqs">Preguntas Frecuentes</a>
                <a class="mx-md-3 d-flex text-md-center align-items-center logIn__Button h5" (click)="openDialog()">Ingresar</a>
            </div>
            <div class="d-none d-md-flex flex-nowrap justify-content-end col-3">
                <a class="d-flex justify-content-between align-items-center whatsAppButton" [href]="whatsAppUrl" target="_blank"><i class="bi bi-whatsapp whatsappIcon mr-4 col-3"></i><span class="col-9">Comunicate con nosotros</span></a>            
            </div>
            <div class="d-flex d-md-none flex-nowrap justify-content-end col-1">
                <button class="btn btn-outline-dark" (click)="toggleMenu()">
                    <i class="bi" [ngClass]="isMenuOpen ? 'bi-x-lg' : 'bi-list'"></i>
                  </button>
            </div>
        </div>
    </div>
</header>
